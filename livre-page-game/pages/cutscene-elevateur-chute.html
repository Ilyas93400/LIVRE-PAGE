<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'appartement en feu - Chute de l'ascenseur</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        #cadre {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        #scene {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1600px;
            height: 900px;
            margin-left: -800px;
            margin-top: -450px;
            transform: scale(var(--k, 1));
            overflow: hidden;
            z-index: 1;
        }

        /* ---------- Vue caméra : paroi noire gauche et droite, rectangle gris au centre ---------- */
        .vue-cam {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(90deg, #000 0%, #000 33%, #333 33%, #333 66%, #000 66%, #000 100%);
            z-index: 0;
        }
        .vue-cam .mur-gauche {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 33%;
            background: #000;
            z-index: 1;
        }
        .vue-cam .mur-droit {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 33%;
            background: #000;
            z-index: 1;
        }
        .vue-cam .centre {
            position: absolute;
            left: 33%;
            right: 33%;
            top: 0;
            bottom: 0;
            background: #2a2a2a;
            z-index: 1;
        }

        /* ---------- L'ascenseur cartoonesque ---------- */
        .ascenseur {
            position: absolute;
            left: 50%;
            top: 200px;
            margin-left: -120px;
            width: 240px;
            height: 300px;
            background: #f5f5f0;
            border: 10px solid #8b8b86;
            border-radius: 6px;
            z-index: 2;
            /* petite ombre */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .toit-ascenseur {
            position: absolute;
            top: -30px;
            left: 50%;
            margin-left: -60px;
            width: 120px;
            height: 30px;
            background: #e0e0df;
            border: 4px solid #8b8b86;
            border-radius: 6px 6px 0 0;
        }
        /* câbles au-dessus */
        .cable {
            position: absolute;
            top: -40px;
            left: 50%;
            margin-left: -4px;
            width: 8px;
            height: 40px;
            background: #5a5a5a;
            z-index: 3;
        }
        /* particules qui tombent */
        . particule {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
        }

        /* ---------- FONDU FINAL ---------- */
        #fondu-final {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }
        #fondu-final.noir { opacity: 1; }
    </style>
</head>
<body>

    <div id="cadre">
    <div id="scene">

        <!-- Vue caméra : 3 bandes verticales -->
        <div class="vue-cam">
            <div class="mur-gauche"></div>
            <div class="centre"></div>
            <div class="mur-droit"></div>
        </div>

        <!-- Ascenseur au centre -->
        <div class="ascenseur">
            <div class="toit-ascenseur"></div>
            <div class="cable"></div>
        </div>

    </div>
    </div>

    <div id="fondu-final"></div>

    <script>
        const ATTENTE = ms => new Promise(r => setTimeout(r, ms));

        async function main() {
            const scene = document.getElementById('scene');
            const fondu = document.getElementById('fondu-final');

            // Laisser le temps de "rien se passer" (2 secondes)
            await ATTENTE(2000);

            // On "coupe" les câbles en supprimant l'ascenseur et en ajoutant des particules
            scene.innerHTML = '';  // nettoyer

            // Créer des particules qui tombent
            const particules = [];
            const couleurs = ['#fff', '#ffb300', '#ff69b4', '#00ffff'];

            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particule';
                p.style.left = (Math.random() * 1400 + 50) + 'px';
                p.style.top = '-' + (Math.random() * 200) + 'px';
                p.style.width = p.style.height = (4 + Math.random() * 6) + 'px';
                p.style.animation = 'fall 4s linear forwards';
                scene.appendChild(p);
                particules.push(p);
            }

            // L'ascenseur qui "tombe" = particules déjà créées qui descendent
            // On peut aussi créer un élément elevateur qui descend
            const elevateur = document.createElement('div');
            elevateur.style.position = 'absolute';
            elevateur.style.left = '50%';
            elevateur.style.top = '200px';
            elevateur.style.width = '240px';
            elevateur.style.height = '300px';
            elevateur.style.background = '#f5f5f0';
            elevateur.style.border = '10px solid #8b8b86';
            elevateur.style.borderRadius = '6px';
            elevateur.style.transform = 'translateX(-50%)';
            elevateur.style.animation = 'elevateurTombe 5s ease forwards';
            scene.appendChild(elevateur);

            // Attendre la fin de l'animation (5s)
            await ATTENTE(5500);

            // Fade out final
            fondu.classList.add('noir');
            await ATTENTE(1500);

            // Redirect vers la page de l'ascenseur qui tombe
            window.location.href = 'elevateur-tombe-page.html';
        }

        main();
    </script>

</body>
</html>",
