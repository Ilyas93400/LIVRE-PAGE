<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'appartement en feu - Ne pas essayer de cuisiner</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        body {
            background: #b32020;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .placeholder {
            position: relative;
            z-index: 5;
            text-align: center;
            color: #ffffff;
        }
        .placeholder h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(34px, 6vw, 64px);
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.45);
        }
        .placeholder p {
            font-family: 'Comic Neue', 'Comic Sans MS', cursive;
            font-size: 24px;
            margin-bottom: 34px;
            opacity: 0.9;
        }
        .placeholder a {
            font-family: 'Bangers', cursive;
            font-size: 24px;
            letter-spacing: 2px;
            color: #FFD700;
            text-decoration: none;
            border: 3px solid #FFD700;
            border-radius: 14px;
            padding: 12px 30px;
            display: inline-block;
            position: relative;
            overflow: visible;
            transition: all 0.25s;
        }
        .placeholder a:hover {
            background: #FFD700;
            color: #7d0018;
            transform: scale(1.05);
            box-shadow: 0 0 14px rgba(255, 40, 40, 0.75),
                        0 0 34px rgba(255, 0, 0, 0.45);
        }
        /* Légère lueur rouge pour garder l'ambiance "rouge" de la transition */
        .glow {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 120%, rgba(255, 90, 0, 0.55), transparent 60%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="placeholder">
        <h1>Ne pas essayer de cuisiner</h1>
        <p>Page en construction...</p>
        <a href="page1.html" class="burn-btn" data-dest="page1.html" data-couleur="blue">← Retour au choix<span class="scorch"></span></a>
    </div>

    <!-- Transition d'écran (noir puis couleur finale) -->
    <div class="screen-transition" id="screenTransition"></div>

    <script src="../shared.js?v=2"></script>
</body>
</html>
