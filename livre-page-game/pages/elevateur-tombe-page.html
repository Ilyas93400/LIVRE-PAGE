<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'appartement en feu - Ascenseur en chute</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        body {
            background: #000;
            height: auto;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ============ EFFECTE DE "ÉCRAN QUI SE RÉANIME" ============ */
        .ecran-noir {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            opacity: 1;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
        }
        .ecran-noir.ouvert { opacity: 0; }

        /* ============ CONTENU QUI APPARAIT ============ */
        .content-container {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 26px;
            padding: 18px 26px 6px;
        }

        .story-box {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 22px;
            padding: 28px;
            min-height: 380px;
            flex: 1;
            max-width: 640px;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            min-height: 324px;
            background: rgba(255,255,255,0.08);
            border: 4px dashed rgba(255,255,255,0.55);
            border-radius: 16px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            overflow: hidden;
            padding: 0;
            color: rgba(255,255,255,0.75);
            font-size: 24px;
            text-align: center;
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            min-height: 324px;
            border-radius: 12px;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .right-box-content {
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .right-box-content h2 {
            font-size: 34px;
            margin: 0;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            border-bottom: 3px solid rgba(255,255,255,0.25);
            padding-bottom: 10px;
        }

        .right-box-content p {
            font-family: 'Comic Neue', 'Comic Sans MS', cursive;
            font-size: 21px;
            line-height: 1.7;
            margin: 0;
        }

        /* ============ BOUTON RECOMMENCER ============ */
        .restart-btn {
            position: relative;
            z-index: 5;
            display: block;
            margin: 30px auto 70px;
            font-family: 'Bangers', cursive;
            font-size: clamp(26px, 4vw, 40px);
            letter-spacing: 3px;
            color: #ffffff;
            background: #1faa3a;
            border: 5px solid #0d6b22;
            border-radius: 24px;
            padding: 22px 60px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.45);
            box-shadow: 0 9px 0 #0d6b22, 0 0 34px rgba(31, 170, 58, 0.6);
            cursor: pointer;
            animation: battement 0.9s ease-in-out infinite;
        }

        .restart-btn:hover {
            background: #2ecb52;
            animation: battementRapide 0.55s ease-in-out infinite;
        }

        @keyframes battement {
            0%, 100% { transform: scale(1); }
            12%       { transform: scale(1.09); }
            24%       { transform: scale(1); }
            36%       { transform: scale(1.06); }
            48%       { transform: scale(1); }
            60%       { transform: scale(1.04); }
            72%       { transform: scale(1); }
            84%       { transform: scale(1.03); }
        }

        @keyframes battementRapide {
            0%, 100% { transform: scale(1.04); }
            50%      { transform: scale(1.12); }
        }

        /* ============ POPUP WARNING ============ */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #overlay.visible { display: flex; }

        .popup {
            position: relative;
            width: min(620px, 92vw);
            background: #1a1a1a;
            border: 6px solid #ff2b2b;
            border-radius: 26px;
            padding: 30px 30px 34px;
            text-align: center;
            transform: translateY(130vh) scale(0.85);
            opacity: 0;
            box-shadow: 0 0 46px rgba(255, 43, 43, 0.55);
        }
        #overlay.visible .popup {
            animation: montePopup 0.65s cubic-bezier(0.18, 1.25, 0.35, 1) forwards;
        }

        @keyframes montePopup {
            0%   { transform: translateY(130vh) scale(0.85); opacity: 0; }
            55%  { transform: translateY(-22px) scale(1.06); opacity: 1; }
            78%  { transform: translateY(10px) scale(0.98); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .popup h3 {
            font-family: 'Bangers', cursive;
            font-size: clamp(40px, 7vw, 68px);
            color: #ff2b2b;
            letter-spacing: 4px;
            margin: 0 0 18px;
            text-shadow: 3px 3px 0 #000;
        }

        .popup .close-x {
            position: absolute;
            top: -22px;
            right: -22px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #ff2b2b;
            border: 5px solid #8b0000;
            color: #ffffff;
            font-family: 'Bangers', cursive;
            font-size: 36px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 5px 0 #8b0000;
            transition: transform 0.2s;
        }
        .popup .close-x:hover {
            transform: scale(1.12) rotate(90deg);
            background: #ff5a5a;
        }

        .popup p {
            font-family: 'Comic Neue', 'Comic Sans MS', cursive;
            font-size: 21px;
            line-height: 1.6;
            color: #ffffff;
            margin: 0 0 26px;
        }

        .popup .btn-recommencer {
            font-family: 'Bangers', cursive;
            font-size: clamp(26px, 4vw, 36px);
            letter-spacing: 3px;
            color: #ffffff;
            background: #d21f1f;
            border: 5px solid #7d0000;
            border-radius: 18px;
            padding: 16px 52px;
            cursor: pointer;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.45);
            box-shadow: 0 8px 0 #7d0000, 0 0 26px rgba(210, 31, 31, 0.6);
            transition: all 0.2s;
        }
        .popup .btn-recommencer:hover {
            background: #ff3535;
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #7d0000, 0 0 36px rgba(255, 53, 53, 0.8);
        }

        @media (max-width: 900px) {
            .content-container { flex-direction: column; align-items: center; }
            .story-box { max-width: 640px; width: 100%; min-height: auto; }
            .site-header { font-size: 30px; }
        }
    </style>
</head>
<body>

    <!-- Écran noir qui s'ouvre au chargement (simule le fade-back) -->
    <div class="ecran-noir" id="ecranNoir"></div>

    <!-- Titre du jeu -->
    <header class="site-header">L'appartement en feu</header>

    <!-- Les deux boîtes noires transparentes -->
    <main class="content-container">

        <!-- Boîte gauche : image -->
        <section class="story-box">
            <div class="image-placeholder">
                <img src="../images/move-a-grave-1024x683.png" alt="Ascenseur en chute">
            </div>
        </section>

        <!-- Boîte droite : titre + scénario -->
        <section class="story-box">
            <div class="right-box-content">
                <h2>Ascenseur en chute</h2>
                <p>L'ascenseur est tombé. Heureusement, vous étiez en sécurité à l'intérieur.</p>
            </div>
        </section>

    </main>

    <!-- Bouton recommencer -->
    <button class="restart-btn" id="btnRecommencer">RECOMMENCER</button>

    <!-- Popup WARNING -->
    <div id="overlay">
        <div class="popup">
            <button class="close-x" id="closeX" aria-label="Fermer">X</button>
            <h3>WARNING!</h3>
            <p>Si vous cliquez sur le bouton en bas de ce texte, vous allez recommencer. Pour ne pas recommencer, cliquez sur le X à l'angle de cette fenêtre.</p>
            <button class="btn-recommencer" id="btnRestartPopup">RECOMMENCER</button>
        </div>
    </div>

    <div id="fondu"></div>

    <script>
        const ecranNoir = document.getElementById('ecranNoir');
        const overlay = document.getElementById('overlay');
        const fondu   = document.getElementById('fondu');

        // Au chargement, on retire l'écran noir progressivement (fade-back)
        window.addEventListener('load', function () {
            // Simuler : l'écran commence noir, puis s'ouvre
            ecranNoir.classList.add('ouvert');
        });

        function ouvrirPopup() {
            overlay.classList.add('visible');
        }

        function fermerPopup() {
            overlay.classList.remove('visible');
        }

        document.getElementById('btnRecommencer').addEventListener('click', ouvrirPopup);
        document.getElementById('closeX').addEventListener('click', fermerPopup);

        document.getElementById('btnRestartPopup').addEventListener('click', function () {
            fermerPopup();
            fondu.classList.add('noir');
            setTimeout(function () {
                window.location.href = '../index.html';
            }, 800);
        });
    </script>

</body>
</html>
